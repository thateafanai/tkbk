name: tkbk
description: "A new Flutter project."
publish_to: 'none'

# Version: Remember to update before release!
version: 1.1.0+10
 # Or your current version

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.11
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  sqflite: ^2.0.0+4
  path_provider: ^2.0.15
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  path: ^1.9.1
  cloud_firestore: ^6.7.1
  audioplayers: ^6.8.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  # flutter_native_splash dependency (should already be here)
  flutter_native_splash: ^2.4.1 # Or your current version

flutter:
  uses-material-design: true

  assets:
    - assets/songs.json
    - assets/logo.png
    - assets/logo_1.png
    - assets/icon/app_icon.png # Keep if used elsewhere
    - assets/branding_text.png # <-- ADDED DECLARATION for branding image
    - assets/fonts/ # Font directory
    - assets/tones/ # Pitch-pipe key tones (C..B)

  fonts:
  - family: Roboto
    fonts:
      - asset: assets/fonts/Roboto-Regular.ttf
  - family: Lato
    fonts:
      - asset: assets/fonts/Lato-Regular.ttf
  - family: Open Sans
    fonts:
      - asset: assets/fonts/OpenSans-Regular.ttf

# flutter_launcher_icons config (ensure image_path points to your desired app icon source)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true # App Store rejects icons with an alpha channel
  # PWA / browser-tab icons, generated from the same source.
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1A237E"

# flutter_native_splash config (updated)
flutter_native_splash:
  # White background color
  color: "#FFFFFF"
  # Optional dark mode color
  # color_dark: "#1A237E"

  # Main logo image (centered). The current design already has generous
  # built-in padding (rounded-square silhouette with transparent corners),
  # so it's safe to use directly without a separate padded derivative.
  image: assets/icon/app_icon.png

  # No separate branding text: Android 12+'s native SplashScreen API only
  # supports a single centered icon, so a bottom-branding layer never shows
  # on phones anyway (only web, where it created an ugly gap). One clean
  # icon everywhere instead.

  # Platform toggles
  android: true
  ios: true

  # Android 12 config (uses main image/color if not specified)
  android_12:
    color: "#FFFFFF"
    image: assets/icon/app_icon.png